name: build-windows

# ساخت فایل اجرایی ویندوز (بدون پنجره‌ی CMD، همراه آیکون) روی سرورهای گیت‌هاب.
#
# ترتیب کار عمداً این‌طور است که خرابیِ مرحله‌ی اختیاری (تک‌فایلی) کل ورک‌فلو را
# از کار نیندازد و نسخه‌ی ماژولار همیشه به‌عنوان آرتیفکت آماده باشد.
#
# خروجی‌ها (تب Actions → Artifacts):
#   PSD-Batch-Generator-windows         ← پوشه‌ی ماژولار (پیشنهادی، همیشه ساخته می‌شود)
#   PSD-Batch-Generator-onefile         ← یک فایل exe تنها (اختیاری)
# با ساختن تگ نسخه (مثل v1.0.0) همین فایل‌ها در Release هم منتشر می‌شوند.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # روی ویندوز خروجی کنسول پیش‌فرض cp1252 است و چاپ متن غیرلاتین
      # (مثل نام فایل‌های نمونه‌ی فارسی) باعث UnicodeEncodeError می‌شود.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: نصب کتابخانه‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ---------------------------------------------------------- ماژولار
      - name: ساخت نسخه‌ی ماژولار (پوشه)
        run: pyinstaller packaging/windows.spec --noconfirm --clean --distpath dist --workpath build

      - name: بسته‌بندی نسخه‌ی ماژولار
        shell: pwsh
        run: Compress-Archive -Path "dist/PSD-Batch-Generator/*" -DestinationPath "dist/PSD-Batch-Generator-windows.zip" -Force

      - name: بارگذاری آرتیفکت نسخه‌ی ماژولار
        uses: actions/upload-artifact@v4
        with:
          name: PSD-Batch-Generator-windows
          path: dist/PSD-Batch-Generator-windows.zip
          if-no-files-found: error

      # --------------------------------------------------------- تک‌فایلی
      - name: ساخت نسخه‌ی تک‌فایلی (اختیاری)
        continue-on-error: true
        env:
          PSD_BATCH_ONEFILE: "1"
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: pyinstaller packaging/windows.spec --noconfirm --clean --distpath dist-onefile --workpath build-onefile

      - name: بسته‌بندی نسخه‌ی تک‌فایلی (اختیاری)
        continue-on-error: true
        shell: pwsh
        run: Compress-Archive -Path "dist-onefile/PSD-Batch-Generator.exe" -DestinationPath "dist-onefile/PSD-Batch-Generator-onefile.zip" -Force

      - name: بارگذاری آرتیفکت نسخه‌ی تک‌فایلی (اختیاری)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: PSD-Batch-Generator-onefile
          path: dist-onefile/PSD-Batch-Generator-onefile.zip
          if-no-files-found: ignore

      # ---------------------------------------------------------- انتشار
      - name: انتشار در Release (فقط برای تگ‌ها)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PSD-Batch-Generator-windows.zip
            dist-onefile/PSD-Batch-Generator-onefile.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
